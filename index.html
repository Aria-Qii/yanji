<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>砚记 · 记账本</title>
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="砚记" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1a1d21;
      --text-2: #8a8f98;
      --line: #eceef1;
      --income: #10b981;
      --expense: #ef4444;
      --accent: #10b981;
      --accent-deep: #0d9d6f;
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(140px + var(--safe-bottom));
    }

    /* ===== 顶部 ===== */
    header {
      position: sticky; top: 0; z-index: 20;
      background: linear-gradient(160deg, #10b981 0%, #0d9d6f 100%);
      padding: calc(14px + var(--safe-top)) 18px 18px;
      color: #fff;
      border-radius: 0 0 22px 22px;
      box-shadow: 0 4px 18px rgba(16,185,129,.28);
    }
    .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .month-nav .arrow {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,.18); border: none; color: #fff;
      font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s;
    }
    .month-nav .arrow:active { background: rgba(255,255,255,.32); }
    .month-label { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
    .month-today { font-size: 12px; opacity: .85; background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 20px; cursor: pointer; border: none; color: #fff; }

    .summary-row { display: flex; gap: 10px; }
    .sum-card { flex: 1; background: rgba(255,255,255,.14); border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(4px); }
    .sum-card .lab { font-size: 12px; opacity: .9; margin-bottom: 4px; }
    .sum-card .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sum-card.balance { background: rgba(255,255,255,.24); }
    .sum-card.balance .val { font-size: 21px; }

    /* ===== 分类统计 ===== */
    .breakdown { background: var(--card); margin: 14px 14px 0; border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    .breakdown-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .breakdown-head h3 { font-size: 14px; font-weight: 600; }
    .breakdown-toggle { font-size: 12px; color: var(--text-2); cursor: pointer; border: none; background: none; }
    .bar-item { margin-bottom: 10px; }
    .bar-item:last-child { margin-bottom: 0; }
    .bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .bar-top .cname { display: flex; align-items: center; gap: 6px; }
    .bar-top .cval { color: var(--text-2); font-variant-numeric: tabular-nums; }
    .bar-track { height: 7px; background: var(--bg); border-radius: 10px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #34d399, #10b981); border-radius: 10px; transition: width .3s; }

    /* ===== 明细列表 ===== */
    .list { margin: 14px 14px 0; }
    .day-group { margin-bottom: 14px; }
    .day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px; }
    .day-date { font-size: 13px; color: var(--text-2); font-weight: 500; }
    .day-total { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .day-total.pos { color: var(--income); }
    .day-total.neg { color: var(--expense); }
    .titem { display: flex; align-items: center; background: var(--card); padding: 13px 14px; border-radius: 13px; margin-bottom: 8px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.03); transition: transform .06s; }
    .titem:active { transform: scale(.985); }
    .titem .ico { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0; }
    .titem .info { flex: 1; margin: 0 12px; min-width: 0; }
    .titem .info .name { font-size: 15px; font-weight: 500; }
    .titem .info .sub { font-size: 12px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .titem .amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .titem .amt.inc { color: var(--income); }
    .titem .amt.exp { color: var(--expense); }
    .titem .amt.trans { color: #3b82f6; }

    .empty { text-align: center; color: var(--text-2); padding: 60px 20px; }
    .empty .big { font-size: 52px; margin-bottom: 12px; }
    .empty p { font-size: 14px; }

    /* ===== 账户视图 ===== */
    .wallet-view { margin: 14px 14px 0; }
    .networth { background: linear-gradient(160deg, #0ea5e9 0%, #2563eb 100%); color: #fff; border-radius: var(--radius); padding: 20px 18px; box-shadow: 0 4px 18px rgba(37,99,235,.22); }
    .networth .lab { font-size: 13px; opacity: .9; margin-bottom: 6px; }
    .networth .val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .networth .hint { font-size: 11px; opacity: .8; margin-top: 6px; }
    .wallet-section { margin-top: 16px; }
    .wallet-section .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
    .wallet-section .sec-head h3 { font-size: 14px; font-weight: 600; }
    .wallet-section .sec-head button { font-size: 13px; color: var(--accent-deep); border: none; background: none; cursor: pointer; font-weight: 600; }
    .wallet-item { display: flex; align-items: center; background: var(--card); padding: 14px; border-radius: 14px; margin-bottom: 9px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.03); }
    .wallet-item .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .wallet-item .wmid { flex: 1; margin: 0 12px; min-width: 0; }
    .wallet-item .wmid .wname { font-size: 15px; font-weight: 600; }
    .wallet-item .wmid .wsub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
    .wallet-item .wbal { text-align: right; font-variant-numeric: tabular-nums; }
    .wallet-item .wbal .bval { font-size: 16px; font-weight: 700; }
    .wallet-item .wbal .blab { font-size: 11px; color: var(--text-2); margin-top: 2px; }
    .pos { color: var(--income); }
    .neg { color: var(--expense); }

    /* ===== 统计视图 ===== */
    .stats-view { margin: 14px 14px 0; }
    .stat-cards { display: flex; gap: 10px; }
    .stat-card { flex: 1; background: var(--card); border-radius: 14px; padding: 13px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    .stat-card .lab { font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
    .stat-card .val { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chart-card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-top: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    .chart-head h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
    .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .dot.inc { background: var(--income); }
    .dot.exp { background: var(--expense); }
    .dot.bal { background: #3b82f6; }
    #trendChart { width: 100%; height: 220px; display: block; }
    .mt-head, .mt-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; align-items: center; padding: 9px 2px; font-size: 13px; }
    .mt-head { color: var(--text-2); font-size: 12px; border-bottom: 1px solid var(--line); }
    .mt-row { border-bottom: 1px solid var(--line); }
    .mt-row:last-child { border-bottom: none; }
    .mt-head span:not(:first-child), .mt-row span:not(:first-child) { text-align: right; }
    .mt-row .mon { color: var(--text); font-weight: 500; }
    .mt-row .inc { color: var(--income); font-variant-numeric: tabular-nums; }
    .mt-row .exp { color: var(--expense); font-variant-numeric: tabular-nums; }
    .mt-row .bal { font-variant-numeric: tabular-nums; font-weight: 600; }

    /* ===== 预算条 ===== */
    .budget-bar { margin-top: 12px; }
    .budget-label { display: flex; justify-content: space-between; font-size: 12px; opacity: .95; margin-bottom: 5px; }
    .budget-label #budgetPct { font-weight: 600; }
    .budget-track { height: 7px; background: rgba(0,0,0,.18); border-radius: 10px; overflow: hidden; }
    .budget-fill { height: 100%; background: #fff; border-radius: 10px; transition: width .3s; }
    .budget-fill.warn { background: #fde68a; }
    .budget-fill.over { background: #fca5a5; }

    /* ===== 快速记账 ===== */
    .quick-bar { margin: 12px 14px 0; }
    .quick-bar input { width: 100%; border: 1.5px solid var(--accent); border-radius: 13px; padding: 12px 14px; font-size: 15px; background: #fff; outline: none; }
    .quick-bar input:focus { box-shadow: 0 0 0 3px rgba(16,185,129,.15); }

    /* ===== 搜索栏 ===== */
    .search-bar { margin: 12px 14px 0; position: relative; }
    .search-bar input { width: 100%; border: none; border-radius: 13px; padding: 12px 40px 12px 14px; font-size: 15px; background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.04); outline: none; }
    .search-bar input:focus { box-shadow: 0 0 0 2px rgba(16,185,129,.25); }
    .search-bar button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--bg); color: var(--text-2); cursor: pointer; font-size: 14px; }
    .search-count { font-size: 12px; color: var(--text-2); padding: 4px 6px 8px; }

    /* ===== 设置 ===== */
    .settings-view { margin: 14px 14px 0; }
    .settings-view .btn { width: 100%; display: block; }
    .hint-line { font-size: 12px; color: var(--text-2); margin-top: 10px; line-height: 1.6; }
    .cm-group { margin-bottom: 12px; }
    .cm-title { font-size: 12px; color: var(--text-2); margin-bottom: 7px; }
    .cm-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .cm-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); padding: 6px 11px; border-radius: 20px; font-size: 13px; }
    .cm-chip .del { cursor: pointer; color: var(--text-2); font-weight: 700; }
    .cm-add { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 2px; }
    .cm-type { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 8px; }
    .cm-tb { flex: 1; padding: 7px 0; border: none; background: none; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; }
    .cm-tb.on { background: #fff; color: var(--accent-deep); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .cm-add input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; outline: none; background: var(--bg); margin-bottom: 8px; }

    /* ===== 分类统计 ===== */
    .catstat-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .catstat-type, .catstat-period { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; }
    .catstat-type button, .catstat-period button { border: none; background: none; padding: 6px 11px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; }
    .catstat-type button.on, .catstat-period button.on { background: #fff; color: var(--accent-deep); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .donut-wrap { display: flex; justify-content: center; margin: 4px 0 14px; }
    .cat-rank-item { margin-bottom: 10px; }
    .cat-rank-item:last-child { margin-bottom: 0; }
    .cat-rank-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .cat-rank-top .cname { display: flex; align-items: center; gap: 6px; }
    .cdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }

    /* ===== 悬浮按钮 & 底部导航 ===== */
    .fab { position: fixed; right: 20px; bottom: calc(86px + var(--safe-bottom)); width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 30px; line-height: 1; box-shadow: 0 6px 20px rgba(16,185,129,.42); cursor: pointer; z-index: 30; display: flex; align-items: center; justify-content: center; transition: transform .12s, background .12s; }
    .fab:active { transform: scale(.92); background: var(--accent-deep); }

    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: var(--safe-bottom); }
    .tab { flex: 1; padding: 9px 0 7px; text-align: center; border: none; background: none; cursor: pointer; color: var(--text-2); font-size: 11px; }
    .tab .tic { font-size: 21px; display: block; margin-bottom: 2px; }
    .tab.active { color: var(--accent-deep); font-weight: 600; }

    /* ===== 弹窗 ===== */
    .mask { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .22s; }
    .mask.show { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--card); border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + var(--safe-bottom)); transform: translateY(100%); transition: transform .26s cubic-bezier(.32,.72,.28,1); max-height: 88vh; overflow-y: auto; }
    .sheet.show { transform: translateY(0); }
    .sheet .grab { width: 40px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 16px; }

    .type-switch { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
    .type-btn { flex: 1; padding: 9px 0; border: none; background: none; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: all .15s; }
    .type-btn.active-exp { background: #fff; color: var(--expense); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .type-btn.active-inc { background: #fff; color: var(--income); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .type-btn.active-transfer { background: #fff; color: #3b82f6; box-shadow: 0 2px 6px rgba(0,0,0,.08); }

    .wallet-pick { margin-bottom: 14px; }
    .wallet-pick .plabel { font-size: 12px; color: var(--text-2); margin-bottom: 7px; }
    .wallet-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .wallet-chips::-webkit-scrollbar { display: none; }
    .wchip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 20px; background: var(--bg); border: 1.5px solid transparent; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .wchip.on { background: rgba(16,185,129,.1); border-color: var(--accent); color: var(--accent-deep); font-weight: 600; }

    .amt-input { width: 100%; border: none; outline: none; font-size: 38px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; padding: 6px 0; margin-bottom: 6px; background: transparent; }
    .amt-hint { text-align: center; color: var(--text-2); font-size: 12px; margin-bottom: 14px; }

    .cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 6px; margin-bottom: 14px; }
    .cat-item { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 2px; border-radius: 12px; cursor: pointer; border: none; background: none; transition: background .12s; }
    .cat-item .cic { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--bg); }
    .cat-item span { font-size: 11px; color: var(--text-2); }
    .cat-item.on { background: rgba(16,185,129,.1); }
    .cat-item.on .cic { background: rgba(16,185,129,.18); }
    .cat-item.on span { color: var(--accent-deep); font-weight: 600; }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
    .field input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 15px; outline: none; background: var(--bg); }
    .field input:focus { border-color: var(--accent); background: #fff; }

    .emoji-pick { display: flex; flex-wrap: wrap; gap: 8px; }
    .emoji-pick .eopt { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; border: 2px solid transparent; }
    .emoji-pick .eopt.on { border-color: var(--accent); background: rgba(16,185,129,.12); }

    .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn { flex: 1; padding: 14px 0; border-radius: 13px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:active { background: var(--accent-deep); }
    .btn.danger { background: #fee2e2; color: var(--expense); }
    .btn.ghost { background: var(--bg); color: var(--text-2); }
  </style>
</head>
<body>
  <header>
    <div class="month-nav">
      <button class="arrow" onclick="changeMonth(-1)">‹</button>
      <div style="text-align:center;">
        <div class="month-label" id="monthLabel">—</div>
        <button class="month-today" onclick="gotoToday()">回到本月</button>
      </div>
      <button class="arrow" onclick="changeMonth(1)">›</button>
    </div>
    <div class="summary-row">
      <div class="sum-card"><div class="lab">支出</div><div class="val" id="sumExpense">¥0</div></div>
      <div class="sum-card"><div class="lab">收入</div><div class="val" id="sumIncome">¥0</div></div>
      <div class="sum-card balance"><div class="lab">结余</div><div class="val" id="sumBalance">¥0</div></div>
    </div>
    <div class="budget-bar" id="budgetBar" style="display:none;">
      <div class="budget-label"><span id="budgetText"></span><span id="budgetPct"></span></div>
      <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
    </div>
  </header>

  <div class="quick-bar">
    <input id="quickInput" placeholder="💬 一句话记账：午餐 35 微信" />
  </div>

  <div class="search-bar" id="searchBar">
    <input id="searchInput" placeholder="搜索账单（分类 / 备注 / 账户 / 金额）" />
    <button id="searchClear" style="display:none;" onclick="clearSearch()">✕</button>
  </div>

  <section class="breakdown" id="breakdownBox" style="display:none;">
    <div class="breakdown-head">
      <h3>📊 支出分类</h3>
      <button class="breakdown-toggle" onclick="toggleBreakdown()">收起</button>
    </div>
    <div id="breakdownBody"></div>
  </section>

  <main class="list" id="list"></main>

  <!-- 账户视图 -->
  <section class="wallet-view" id="walletView" style="display:none;">
    <div class="networth">
      <div class="lab">净资产（所有账户合计）</div>
      <div class="val" id="netWorth">¥0</div>
      <div class="hint">余额 = 初始余额 + 收入 − 支出 · 负债账户可为负</div>
    </div>
    <div class="wallet-section">
      <div class="sec-head">
        <h3>我的账户</h3>
        <button onclick="openWalletEdit()">＋ 添加账户</button>
      </div>
      <div id="walletList"></div>
    </div>
  </section>

  <!-- 统计视图 -->
  <section class="stats-view" id="statsView" style="display:none;">
    <div class="stat-cards">
      <div class="stat-card"><div class="lab">月均支出</div><div class="val neg" id="avgExp">¥0</div></div>
      <div class="stat-card"><div class="lab">月均收入</div><div class="val pos" id="avgInc">¥0</div></div>
      <div class="stat-card"><div class="lab">近12月结余</div><div class="val" id="totalBal">¥0</div></div>
    </div>
    <div class="chart-card">
      <div class="chart-head"><h3>📈 收支趋势（近12个月）</h3></div>
      <div class="legend">
        <span><i class="dot inc"></i>收入</span>
        <span><i class="dot exp"></i>支出</span>
        <span><i class="dot bal"></i>结余</span>
      </div>
      <canvas id="trendChart"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-head"><h3>🏷️ 分类统计</h3></div>
      <div class="catstat-controls">
        <div class="catstat-type">
          <button class="cst on" data-t="expense">支出</button>
          <button class="cst" data-t="income">收入</button>
        </div>
        <div class="catstat-period">
          <button class="csp on" data-p="month">本月</button>
          <button class="csp" data-p="3m">近3月</button>
          <button class="csp" data-p="12m">近12月</button>
          <button class="csp" data-p="all">全部</button>
        </div>
      </div>
      <div class="donut-wrap"><canvas id="catDonut"></canvas></div>
      <div id="catStatList"></div>
    </div>
    <div class="chart-card">
      <div class="chart-head"><h3>📅 每月明细</h3></div>
      <div id="monthTable"></div>
    </div>
  </section>

  <!-- 设置视图 -->
  <section class="settings-view" id="settingsView" style="display:none;">
    <div class="chart-card">
      <div class="chart-head"><h3>🎯 月度预算</h3></div>
      <div class="field"><label>每月预算金额（元）</label><input id="budgetInput" inputmode="decimal" placeholder="如 3000" /></div>
      <button class="btn primary" style="margin-top:4px;" onclick="saveBudget()">保存预算</button>
      <div class="hint-line" id="budgetHint"></div>
    </div>
    <div class="chart-card">
      <div class="chart-head"><h3>🏷️ 分类管理</h3></div>
      <div class="cm-group"><div class="cm-title">支出分类</div><div class="cm-list" id="expCatList"></div></div>
      <div class="cm-group"><div class="cm-title">收入分类</div><div class="cm-list" id="incCatList"></div></div>
      <div class="cm-add">
        <div class="cm-type" id="cmType">
          <button class="cm-tb on" data-t="expense">支出</button>
          <button class="cm-tb" data-t="income">收入</button>
        </div>
        <input id="newCatName" placeholder="分类名称，如：健身" />
        <div class="emoji-pick" id="catEmojiPick"></div>
        <button class="btn primary" style="margin-top:10px;" onclick="addCategory()">＋ 添加分类</button>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-head"><h3>📤 数据导出</h3></div>
      <button class="btn primary" onclick="exportCSV()">导出账单 CSV</button>
      <div class="hint-line">CSV 可用 Excel / WPS 打开，含全部账单（支出为负数、收入为正数、转账无符号）</div>
    </div>
    <div class="chart-card">
      <div class="chart-head"><h3>ℹ️ 关于</h3></div>
      <div class="hint-line">砚记 · 本地记账<br/>数据仅存本机浏览器，不上传任何服务器</div>
    </div>
  </section>

  <button class="fab" onclick="openAdd()">+</button>

  <nav class="tabbar">
    <button class="tab active" id="tabList" onclick="switchTab('list')"><span class="tic">📒</span>明细</button>
    <button class="tab" id="tabStats" onclick="switchTab('stats')"><span class="tic">📊</span>统计</button>
    <button class="tab" id="tabWallet" onclick="switchTab('wallet')"><span class="tic">💼</span>账户</button>
    <button class="tab" id="tabSettings" onclick="switchTab('settings')"><span class="tic">⚙️</span>设置</button>
  </nav>

  <!-- 记账弹窗 -->
  <div class="mask" id="mask" onclick="closeAll()"></div>
  <div class="sheet" id="sheetTxn">
    <div class="grab"></div>
    <div class="type-switch">
      <button class="type-btn active-exp" id="btnExp" onclick="setType('expense')">支出</button>
      <button class="type-btn" id="btnInc" onclick="setType('income')">收入</button>
      <button class="type-btn" id="btnTransfer" onclick="setType('transfer')">转账</button>
    </div>
    <input class="amt-input" id="amtInput" inputmode="decimal" placeholder="0.00" />
    <div class="amt-hint">请输入金额</div>
    <div class="wallet-pick" id="singleWalletPick">
      <div class="plabel">选择账户</div>
      <div class="wallet-chips" id="walletChips"></div>
    </div>
    <div class="wallet-pick" id="transferPick" style="display:none;">
      <div class="plabel">转出账户</div>
      <div class="wallet-chips" id="fromChips"></div>
      <div class="plabel" style="margin-top:10px;">转入账户</div>
      <div class="wallet-chips" id="toChips"></div>
    </div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="field"><label>备注（选填）</label><input id="noteInput" placeholder="写点什么…" /></div>
    <div class="field"><label>日期</label><input id="dateInput" type="date" /></div>
    <div class="sheet-actions">
      <button class="btn danger" id="btnDelete" style="display:none;" onclick="deleteTx()">删除</button>
      <button class="btn ghost" onclick="closeAll()">取消</button>
      <button class="btn primary" onclick="saveTx()">保存</button>
    </div>
  </div>

  <!-- 账户编辑弹窗 -->
  <div class="sheet" id="sheetWallet">
    <div class="grab"></div>
    <h2 style="font-size:17px; margin-bottom:16px;" id="walletSheetTitle">添加账户</h2>
    <div class="field"><label>账户名称</label><input id="walletNameInput" placeholder="如：微信、支付宝、信用卡…" /></div>
    <div class="field"><label>图标</label><div class="emoji-pick" id="emojiPick"></div></div>
    <div class="field"><label>初始余额（选填，负债填负数）</label><input id="walletInitInput" inputmode="decimal" placeholder="0.00" /></div>
    <div class="sheet-actions">
      <button class="btn danger" id="btnWalletDelete" style="display:none;" onclick="deleteWallet()">删除账户</button>
      <button class="btn ghost" onclick="closeAll()">取消</button>
      <button class="btn primary" onclick="saveWallet()">保存</button>
    </div>
  </div>

<script>
(function(){
  const KEY_T = 'yanji_transactions_v1';
  const KEY_W = 'yanji_wallets_v1';
  const KEY_LAST = 'yanji_lastwallet_v1';
  const KEY_BUDGET = 'yanji_budget_v1';

  const DEFAULT_EXPENSE_CATS = [
    ['餐饮','🍜'],['交通','🚗'],['购物','🛍️'],['居住','🏠'],['娱乐','🎮'],
    ['医疗','💊'],['通讯','📱'],['教育','📚'],['宠物','🐱'],['日用','🧻'],
    ['服饰','👗'],['人情','🧧'],['旅行','✈️'],['其他','📦']
  ];
  const DEFAULT_INCOME_CATS = [
    ['工资','💰'],['奖金','🎁'],['理财','📈'],['兼职','💼'],['报销','🧾'],
    ['红包','🧧'],['其他','✨']
  ];
  const KEY_EXP_CATS = 'yanji_cats_expense_v1';
  const KEY_INC_CATS = 'yanji_cats_income_v1';
  const CAT_EMOJIS = ['🍜','🍔','🍰','☕','🍺','🛒','🛍️','👗','👟','💄','🚗','⛽','🚇','✈️','🏠','💡','💧','📱','💻','🎮','🎬','🏋️','⚽','💊','🏥','📚','🎓','🐱','🐶','💰','💳','🧧','🎁','🎉','💍','👶','🍼','🏦','📈','🧾','🔧','🧹','🌹','🎵','🎨','🧋','🍎','📦','✨','🌟','🔥','❤️'];
  const BG_PALETTE = ['#fff1e6','#e6f0ff','#ffe9f0','#eef7ee','#f0e6ff','#e6fbff','#fffbe6','#f3ecff','#eef2f6','#ffe9e6'];
  const DONUT_PALETTE = ['#10b981','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#14b8a6','#6366f1','#e11d48','#22c55e','#a855f7','#facc15','#0891b2'];
  let expenseCats = [];
  let incomeCats = [];
  const WALLET_EMOJIS = ['💬','🔷','💳','🚗','🏦','💰','🐷','📱','🧾','💵','🪙','🏧','✈️','🎁','✨'];
  const CAT_BG = {
    '🍜':'#fff1e6','🚗':'#e6f0ff','🛍️':'#ffe9f0','🏠':'#eef7ee','🎮':'#f0e6ff',
    '💊':'#ffe9e6','📱':'#e6fbff','📚':'#fffbe6','🐱':'#f3ecff','🧻':'#eef2f6',
    '👗':'#ffe9f5','🧧':'#ffebe6','✈️':'#e6f4ff','📦':'#eef0f2','💰':'#e9f7ee',
    '🎁':'#fff0e0','📈':'#e6f7f0','💼':'#e6f0ff','🧾':'#eef7ff','✨':'#fffbe6'
  };
  function catBg(emoji){
    if(CAT_BG[emoji]) return CAT_BG[emoji];
    let h = 0; for(const c of emoji) h = (h*31 + c.charCodeAt(0)) >>> 0;
    return BG_PALETTE[h % BG_PALETTE.length];
  }
  const DEFAULT_WALLETS = [
    {id:'w_wechat', name:'微信', emoji:'💬', initial:0},
    {id:'w_alipay', name:'支付宝', emoji:'🔷', initial:0},
    {id:'w_credit', name:'信用卡', emoji:'💳', initial:0},
    {id:'w_carloan', name:'车贷', emoji:'🚗', initial:0},
    {id:'w_salary', name:'工资卡', emoji:'🏦', initial:0}
  ];

  let txns = [];
  let wallets = [];
  let currentMonth = '';
  let currentTab = 'list';
  let searchQuery = '';
  let editingId = null;
  let currentType = 'expense';
  let currentCat = null;
  let currentWallet = null;
  let currentFromWallet = null;
  let currentToWallet = null;
  let showBreakdown = true;
  let newCatType = 'expense';
  let pickedCatEmoji = '🍜';
  let catStatType = 'expense';
  let catStatPeriod = 'month';
  // 账户编辑状态
  let editingWalletId = null;
  let pickedEmoji = '💬';

  function load(){
    try { txns = JSON.parse(localStorage.getItem(KEY_T) || '[]'); } catch(e){ txns = []; }
    txns.forEach(t => { if(!t.wallet) t.wallet = null; });
    try { wallets = JSON.parse(localStorage.getItem(KEY_W) || 'null'); } catch(e){ wallets = null; }
    if(!wallets){ wallets = JSON.parse(JSON.stringify(DEFAULT_WALLETS)); saveWallets(); }
    loadCats();
  }
  function loadCats(){
    try { expenseCats = JSON.parse(localStorage.getItem(KEY_EXP_CATS) || 'null'); } catch(e){ expenseCats = null; }
    if(!expenseCats || !expenseCats.length){ expenseCats = JSON.parse(JSON.stringify(DEFAULT_EXPENSE_CATS)); }
    try { incomeCats = JSON.parse(localStorage.getItem(KEY_INC_CATS) || 'null'); } catch(e){ incomeCats = null; }
    if(!incomeCats || !incomeCats.length){ incomeCats = JSON.parse(JSON.stringify(DEFAULT_INCOME_CATS)); }
    saveCats();
  }
  function saveCats(){
    localStorage.setItem(KEY_EXP_CATS, JSON.stringify(expenseCats));
    localStorage.setItem(KEY_INC_CATS, JSON.stringify(incomeCats));
  }
  function save(){ localStorage.setItem(KEY_T, JSON.stringify(txns)); }
  function saveWallets(){ localStorage.setItem(KEY_W, JSON.stringify(wallets)); }

  function walletById(id){ return wallets.find(w => w.id === id) || null; }
  function walletBalance(w){
    let b = w.initial || 0;
    txns.forEach(t => {
      if(t.type === 'transfer'){
        if(t.from === w.id) b -= t.amount;
        if(t.to === w.id) b += t.amount;
      } else if(t.wallet === w.id){
        if(t.type === 'income') b += t.amount; else b -= t.amount;
      }
    });
    return Math.round(b*100)/100;
  }
  function totalNetWorth(){ return Math.round(wallets.reduce((s,w)=> s + walletBalance(w), 0)*100)/100; }

  function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  function nowMonth(){ return monthKey(new Date()); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  function fmtMoney(n){ return (n<0?'-':'') + '¥' + Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2, maximumFractionDigits:2}); }
  function fmtPlain(n){ return n.toLocaleString('zh-CN',{minimumFractionDigits:2, maximumFractionDigits:2}); }

  function monthTxns(m){ return txns.filter(t => t.date.startsWith(m)); }

  function render(){
    const mt = monthTxns(currentMonth);
    let exp=0, inc=0;
    mt.forEach(t => { if(t.type==='expense') exp+=t.amount; else inc+=t.amount; });
    const bal = inc - exp;
    document.getElementById('monthLabel').textContent = monthLabelText(currentMonth);
    document.getElementById('sumExpense').textContent = fmtMoney(exp);
    document.getElementById('sumIncome').textContent = fmtMoney(inc);
    const balEl = document.getElementById('sumBalance');
    balEl.textContent = fmtMoney(bal);
    balEl.style.color = bal >= 0 ? 'rgba(255,255,255,.95)' : '#ffe0d4';
    renderBudget(exp);
    if(searchQuery){
      renderSearch();
      document.getElementById('breakdownBox').style.display = 'none';
    } else {
      renderList(mt);
      renderBreakdown(mt);
    }
    renderWallets();
    if(currentTab === 'stats') renderStats();
  }

  function monthLabelText(m){
    const [y, mo] = m.split('-').map(Number);
    const now = new Date();
    return y + '年' + mo + '月' + ((now.getFullYear()===y && (now.getMonth()+1)===mo) ? ' · 本月' : '');
  }

  function txnItemHtml(t){
    if(t.type === 'transfer'){
      const fw = walletById(t.from), tw = walletById(t.to);
      const fromTxt = fw ? (fw.emoji+' '+fw.name) : '未指定';
      const toTxt = tw ? (tw.emoji+' '+tw.name) : '未指定';
      const subParts = [fromTxt+' → '+toTxt, t.note].filter(Boolean);
      return '<div class="titem" data-id="'+t.id+'">'
        + '<div class="ico" style="background:#e6f0ff">🔁</div>'
        + '<div class="info"><div class="name">转账</div><div class="sub">'+escapeHtml(subParts.join(' · '))+'</div></div>'
        + '<div class="amt trans">'+fmtPlain(t.amount)+'</div>'
        + '</div>';
    }
    const [name, emoji] = catOf(t.type, t.category);
    const bg = catBg(emoji);
    const amtCls = t.type==='income' ? 'inc' : 'exp';
    const sign = t.type==='income' ? '+' : '-';
    const w = walletById(t.wallet);
    const wTxt = w ? (w.emoji + ' ' + w.name) : '';
    const subParts = [wTxt, t.note].filter(Boolean);
    const sub = subParts.length ? '<div class="sub">'+escapeHtml(subParts.join(' · '))+'</div>' : '';
    return '<div class="titem" data-id="'+t.id+'">'
      + '<div class="ico" style="background:'+bg+'">'+emoji+'</div>'
      + '<div class="info"><div class="name">'+name+'</div>'+sub+'</div>'
      + '<div class="amt '+amtCls+'">'+sign+fmtPlain(t.amount)+'</div>'
      + '</div>';
  }

  function buildDayGroups(arr){
    const byDay = {};
    arr.forEach(t => { if(!byDay[t.date]) byDay[t.date]=[]; byDay[t.date].push(t); });
    const days = Object.keys(byDay).sort().reverse();
    let html = '';
    days.forEach(d => {
      const items = byDay[d].sort((a,b)=> b.createdAt - a.createdAt);
      const net = items.reduce((s,t)=> s + (t.type==='income'? t.amount : (t.type==='expense'? -t.amount : 0)), 0);
      const totalCls = net>0 ? 'pos' : (net<0 ? 'neg' : '');
      html += '<div class="day-group"><div class="day-head"><span class="day-date">'+prettyDate(d)+'</span><span class="day-total '+totalCls+'">'+(net>0?'+':'')+fmtPlain(net)+'</span></div>';
      items.forEach(t => { html += txnItemHtml(t); });
      html += '</div>';
    });
    return html;
  }

  function renderList(mt){
    const list = document.getElementById('list');
    if(mt.length === 0){
      list.innerHTML = '<div class="empty"><div class="big">🪨</div><p>这个月还没有记录<br/>点右下角 + 开始记一笔吧</p></div>';
      return;
    }
    list.innerHTML = buildDayGroups(mt);
    document.querySelectorAll('.titem').forEach(el => el.addEventListener('click', () => openEdit(el.dataset.id)));
  }

  function renderSearch(){
    const q = searchQuery.toLowerCase();
    const filtered = txns.filter(t => {
      const catName = (t.type !== 'transfer') ? catOf(t.type, t.category)[0] : '';
      const w = walletById(t.wallet), fw = walletById(t.from), tw = walletById(t.to);
      const hay = [t.note||'', catName, t.category||'', w?w.name:'', fw?fw.name:'', tw?tw.name:'', t.date, String(t.amount)].join(' ').toLowerCase();
      return hay.includes(q);
    }).sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
    const list = document.getElementById('list');
    if(filtered.length === 0){
      list.innerHTML = '<div class="empty"><div class="big">🔍</div><p>没有找到「'+escapeHtml(searchQuery)+'」相关账单</p></div>';
      return;
    }
    list.innerHTML = '<div class="search-count">找到 '+filtered.length+' 笔记录</div>' + buildDayGroups(filtered);
    document.querySelectorAll('.titem').forEach(el => el.addEventListener('click', () => openEdit(el.dataset.id)));
  }

  function renderBreakdown(mt){
    const box = document.getElementById('breakdownBox');
    const body = document.getElementById('breakdownBody');
    const expItems = mt.filter(t => t.type==='expense');
    if(expItems.length === 0){ box.style.display = 'none'; return; }
    box.style.display = showBreakdown ? 'block' : 'none';
    const byCat = {};
    expItems.forEach(t => { byCat[t.category] = (byCat[t.category]||0) + t.amount; });
    const total = Object.values(byCat).reduce((a,b)=>a+b,0);
    const arr = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    let html = '';
    arr.forEach(([cat, v]) => {
      const [name, emoji] = catOf('expense', cat);
      const pct = total>0 ? (v/total*100) : 0;
      html += '<div class="bar-item"><div class="bar-top"><span class="cname">'+emoji+' '+name+'</span><span class="cval">'+fmtPlain(v)+' · '+pct.toFixed(1)+'%</span></div>'
        + '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(pct,2)+'%"></div></div></div>';
    });
    body.innerHTML = html;
  }

  function renderWallets(){
    const el = document.getElementById('walletList');
    const nw = totalNetWorth();
    const nwEl = document.getElementById('netWorth');
    nwEl.textContent = (nw>=0?'':'−') + '¥' + Math.abs(nw).toLocaleString('zh-CN',{minimumFractionDigits:2, maximumFractionDigits:2});
    nwEl.style.color = '#fff';
    if(wallets.length === 0){
      el.innerHTML = '<div class="empty"><div class="big">💼</div><p>还没有账户<br/>点右上角「添加账户」建一个</p></div>';
      return;
    }
    let html = '';
    wallets.forEach(w => {
      const b = walletBalance(w);
      const cls = b >= 0 ? 'pos' : 'neg';
      const initTxt = (w.initial && w.initial !== 0) ? ('初始 ' + (w.initial>=0?'':'-') + '¥' + fmtPlain(Math.abs(w.initial))) : '';
      const inOut = walletFlowText(w);
      const sub = [initTxt, inOut].filter(Boolean).join(' · ');
      html += '<div class="wallet-item" data-wid="'+w.id+'">'
        + '<div class="ico">'+w.emoji+'</div>'
        + '<div class="wmid"><div class="wname">'+escapeHtml(w.name)+'</div><div class="wsub">'+escapeHtml(sub)+'</div></div>'
        + '<div class="wbal"><div class="bval '+cls+'">'+(b>=0?'':'−')+'¥'+fmtPlain(Math.abs(b))+'</div><div class="blab">当前余额</div></div>'
        + '</div>';
    });
    el.innerHTML = html;
    document.querySelectorAll('.wallet-item').forEach(el => el.addEventListener('click', () => openWalletEdit(el.dataset.wid)));
  }

  function walletFlowText(w){
    let inc = 0, exp = 0, tin = 0, tout = 0;
    txns.forEach(t => {
      if(t.type === 'transfer'){
        if(t.from === w.id) tout += t.amount;
        if(t.to === w.id) tin += t.amount;
      } else if(t.wallet === w.id){
        if(t.type === 'income') inc += t.amount; else exp += t.amount;
      }
    });
    const parts = [];
    if(inc > 0) parts.push('收¥'+fmtPlain(inc));
    if(exp > 0) parts.push('支¥'+fmtPlain(exp));
    if(tin > 0) parts.push('转入¥'+fmtPlain(tin));
    if(tout > 0) parts.push('转出¥'+fmtPlain(tout));
    return parts.join(' · ');
  }

  function catOf(type, category){
    const list = type==='income' ? incomeCats : expenseCats;
    const found = list.find(c => c[0]===category);
    return found || [category, '📦'];
  }

  function prettyDate(d){
    const [y,m,dd] = d.split('-').map(Number);
    if(d === todayStr()) return '今天';
    const dt = new Date(y, m-1, dd);
    const days = ['日','一','二','三','四','五','六'][dt.getDay()];
    return m+'月'+dd+'日 · 周'+days;
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ===== 顶部 / 标签 =====
  window.changeMonth = function(delta){
    const [y,m] = currentMonth.split('-').map(Number);
    currentMonth = monthKey(new Date(y, m-1+delta, 1));
    render();
  };
  window.gotoToday = function(){ currentMonth = nowMonth(); render(); };

  window.switchTab = function(t){
    currentTab = t;
    document.getElementById('tabList').className = 'tab' + (t==='list'?' active':'');
    document.getElementById('tabStats').className = 'tab' + (t==='stats'?' active':'');
    document.getElementById('tabWallet').className = 'tab' + (t==='wallet'?' active':'');
    document.getElementById('tabSettings').className = 'tab' + (t==='settings'?' active':'');
    document.getElementById('list').style.display = t==='list' ? '' : 'none';
    document.getElementById('searchBar').style.display = t==='list' ? '' : 'none';
    document.getElementById('breakdownBox').style.display = (t==='list' && !searchQuery && showBreakdown && monthTxns(currentMonth).some(x=>x.type==='expense')) ? 'block' : 'none';
    document.getElementById('walletView').style.display = t==='wallet' ? '' : 'none';

  // ===== 统计 / 图表 =====
  function lastMonths(n){
    const arr = [];
    const now = new Date();
    for(let i=n-1; i>=0; i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);

  function monthStats(m){
    const mt = monthTxns(m);
    let exp=0, inc=0;
    mt.forEach(t => { if(t.type==='expense') exp+=t.amount; else inc+=t.amount; });
    return { exp, inc, bal: inc-exp };
  }
  function monthShort(m){ return Number(m.split('-')[1]) + '月'; }
  function fmtCompact(n){
    const a = Math.abs(n);
    if(a >= 100000000) return (n/100000000).toFixed(1)+'亿';
    if(a >= 10000) return (n/10000).toFixed(a%10000===0?0:1)+'万';
    if(a >= 1000) return (n/1000).toFixed(1)+'k';
    return String(Math.round(n));
  }
  function niceNum(x, round){
    const exp = Math.floor(Math.log10(x));
    const f = x/Math.pow(10,exp);
    let nf;
    if(round) nf = f<1.5?1 : f<3?2 : f<7?5 : 10;
    else nf = f<=1?1 : f<=2?2 : f<=5?5 : 10;
    return nf*Math.pow(10,exp);
  }
  function niceScale(min, max, ticks){
    const range = niceNum(max-min, false);
    const step = niceNum(range/(ticks-1), true);
    return { min: Math.floor(min/step)*step, max: Math.ceil(max/step)*step, step };
  }

  function renderStats(){
    const months = lastMonths(12);
    const stats = months.map(m => ({ m, s: monthStats(m) }));
    const withData = stats.filter(x => x.s.exp>0 || x.s.inc>0);
    const n = withData.length || 1;
    const avgExp = withData.reduce((a,x)=>a+x.s.exp,0)/n;
    const avgInc = withData.reduce((a,x)=>a+x.s.inc,0)/n;
    const totalBal = stats.reduce((a,x)=>a+x.s.bal,0);
    document.getElementById('avgExp').textContent = fmtMoney(avgExp);
    document.getElementById('avgInc').textContent = fmtMoney(avgInc);
    const tb = document.getElementById('totalBal');
    tb.textContent = fmtMoney(totalBal);
    tb.className = 'val ' + (totalBal>=0?'pos':'neg');
    drawChart(stats);
    renderMonthTable(stats);
    renderCatStats();
  }

  function topRounded(ctx, x, y, w, h, r){
    r = Math.min(r, w/2, h);
    ctx.beginPath();
    ctx.moveTo(x, y+h);
    ctx.lineTo(x, y+r);
    ctx.arcTo(x, y, x+r, y, r);
    ctx.lineTo(x+w-r, y);
    ctx.arcTo(x+w, y, x+w, y+r, r);
    ctx.lineTo(x+w, y+h);
    ctx.closePath();
  }

  function drawChart(stats){
    const canvas = document.getElementById('trendChart');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.parentElement.clientWidth;
    const cssH = 220;
    canvas.style.width = cssW+'px';
    canvas.style.height = cssH+'px';
    canvas.width = Math.round(cssW*dpr);
    canvas.height = Math.round(cssH*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const padL = 46, padR = 8, padT = 12, padB = 26;
    const plotW = cssW - padL - padR;
    const plotH = cssH - padT - padB;

    let lo = 0, hi = 0;
    stats.forEach(x => { hi = Math.max(hi, x.s.exp, x.s.inc, x.s.bal); lo = Math.min(lo, x.s.bal); });
    if(hi === 0 && lo === 0) hi = 100;
    const scale = niceScale(lo, hi, 5);
    if(scale.max === scale.min) scale.max = scale.min + 1;
    function valToY(v){ return padT + plotH - ((v - scale.min)/(scale.max - scale.min))*plotH; }

    ctx.font = '10px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const stepCount = Math.round((scale.max - scale.min)/scale.step);
    for(let i=0; i<=stepCount; i++){
      const v = scale.min + scale.step*i;
      const y = valToY(v);
      ctx.strokeStyle = '#eceef1';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(cssW-padR, y);
      ctx.stroke();
      ctx.fillStyle = '#8a8f98';
      ctx.fillText(fmtCompact(v), padL-6, y);
    }
    if(scale.min < 0 && scale.max > 0){
      ctx.strokeStyle = '#c9ced6';
      ctx.beginPath();
      ctx.moveTo(padL, valToY(0));
      ctx.lineTo(cssW-padR, valToY(0));
      ctx.stroke();
    }

    const n = stats.length;
    const groupW = plotW/n;
    const barW = Math.min(groupW*0.3, 13);
    const yBottom = valToY(0);

    stats.forEach((x, idx) => {
      const cx = padL + groupW*idx + groupW/2;
      const expH = x.s.exp / (scale.max-scale.min) * plotH;
      const incH = x.s.inc / (scale.max-scale.min) * plotH;
      if(x.s.exp > 0){
        ctx.fillStyle = '#ef4444';
        topRounded(ctx, cx - barW - 2, yBottom - expH, barW, expH, 2);
        ctx.fill();
      }
      if(x.s.inc > 0){
        ctx.fillStyle = '#10b981';
        topRounded(ctx, cx + 2, yBottom - incH, barW, incH, 2);
        ctx.fill();
      }
      ctx.fillStyle = '#8a8f98';
      ctx.textAlign = 'center';
      ctx.fillText(monthShort(x.m), cx, padT + plotH + 14);
    });

    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    stats.forEach((x, idx) => {
      const cx = padL + groupW*idx + groupW/2;
      const y = valToY(x.s.bal);
      if(idx===0) ctx.moveTo(cx, y); else ctx.lineTo(cx, y);
    });
    ctx.stroke();
    ctx.fillStyle = '#3b82f6';
    stats.forEach((x, idx) => {
      const cx = padL + groupW*idx + groupW/2;
      ctx.beginPath();
      ctx.arc(cx, valToY(x.s.bal), 2.5, 0, Math.PI*2);
      ctx.fill();
    });
  }

  window.exportCSV = function(){
    if(txns.length === 0){ alert('还没有账单可导出'); return; }
    const head = ['日期','类型','金额','分类','账户','备注'];
    const rows = txns.slice().sort((a,b)=> a.date.localeCompare(b.date) || b.createdAt - a.createdAt).map(t => {
      const typeName = t.type==='income' ? '收入' : (t.type==='expense' ? '支出' : '转账');
      let acct, cat = '';
      if(t.type === 'transfer'){
        const fw = walletById(t.from), tw = walletById(t.to);
        acct = (fw?fw.name:'未指定') + ' → ' + (tw?tw.name:'未指定');
      } else {

      }
      const amt = t.type === 'expense' ? -t.amount : t.amount;
      return [t.date, typeName, amt, cat, acct, t.note || ''];
    });
    const csv = [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);

  // ===== 自然语言记账 =====
  function parseNL(raw){
    const s = raw.trim();
    if(!s) return null;
    const amtMatch = s.match(/(?:¥|￥)?(\d+(?:\.\d{1,2})?)\s*(?:元|块|块钱)?/);
    if(!amtMatch || !amtMatch[1]) return null;
    const amount = parseFloat(amtMatch[1]);
    if(!amount || amount <= 0) return null;

    const transferWords = ['转账','转给','转入','转出','还款','还贷','还车贷','还信用卡','还花呗','还白条','充值','提现'];
    const mentionedWallets = wallets.filter(w => s.includes(w.name));
    let fromWallet = null, toWallet = null;
    if(transferWords.some(w => s.includes(w)) && mentionedWallets.length >= 2){
      let target = null;
      for(const w of mentionedWallets){ if(s.includes('还'+w.name)){ target = w; break; } }
      if(!target) target = mentionedWallets[mentionedWallets.length-1];
      toWallet = target.id;
      const src = mentionedWallets.find(w => w !== target);
      fromWallet = src ? src.id : null;
    }
    const nameStripped = wallets.reduce((a,w) => a.split(w.name).join(''), s);
    const incomeWords = ['发工资','工资','薪','收入','奖金','收款','进账','报销','利息','退款','到账','收到','转入','入账','赚','分红','收益'];
    const type = fromWallet ? 'transfer' : (incomeWords.some(w => nameStripped.includes(w)) ? 'income' : 'expense');

    let wallet = null;
    if(!fromWallet){
      for(const w of wallets){ if(s.includes(w.name)){ wallet = w.id; break; } }
      if(!wallet){
        const lower = s.toLowerCase();
        const alias = [['wx','微信'],['wechat','微信'],['vx','微信'],['zfb','支付宝'],['alipay','支付宝']];
        for(const [k,v] of alias){ if(lower.includes(k)){ const w = wallets.find(x=>x.name===v); if(w){ wallet=w.id; break; } } }
      }
    }

    let category = null;
    if(type === 'income'){
      if(s.includes('奖金')) category='奖金';
      else if(s.includes('红包')) category='红包';
      else if(s.includes('理财')||s.includes('利息')||s.includes('收益')) category='理财';
      else if(s.includes('报销')) category='报销';
      else if(s.includes('兼职')||s.includes('外快')) category='兼职';
      else {
        let hit = null;
        for(const [name] of incomeCats){ if(name !== '工资' && s.includes(name)){ hit = name; break; } }
        category = hit || '工资';
      }
    } else if(type === 'expense'){
      const catMap = [
        ['餐饮',['餐','饭','吃','午饭','晚饭','早餐','夜宵','外卖','咖啡','奶茶','喝','美团','饿了么','火锅','烧烤','零食','水果']],
        ['交通',['打车','滴滴','地铁','公交','加油','停车','高铁','火车','机票','出租','出行','过路费']],
        ['居住',['房租','水电','物业','燃气']],
        ['医疗',['药','医院','看病','体检','挂号']],
        ['通讯',['话费','流量','宽带','充值','手机费']],
        ['宠物',['猫','狗','宠物','猫粮','狗粮','罐头']],
        ['娱乐',['电影','游戏','ktv','唱','玩','门票','娱乐']],
        ['人情',['红包','礼金','份子','请客','随礼']],
        ['旅行',['旅行','旅游','酒店','住宿']],
        ['教育',['书','课程','学费','培训','考试']],
        ['日用',['日用','纸巾','牙膏','洗发','洗衣','生活用品']],
        ['购物',['买','购物','淘宝','京东','拼多多','超市','衣服','鞋','包','化妆品']]
      ];
      for(const [cat, words] of catMap){ if(words.some(w=>s.includes(w))){ category=cat; break; } }
      if(!category){
        for(const [name] of expenseCats){ if(s.includes(name)){ category = name; break; } }
      }
      if(!category) category='其他';
    }

    let note = s;
    if(amtMatch[0]) note = note.replace(amtMatch[0], '');
    const strip = [];
    wallets.forEach(w => { if(note.includes(w.name)) strip.push(w.name); });
    incomeWords.forEach(w => { if(note.includes(w)) strip.push(w); });
    transferWords.forEach(w => { if(note.includes(w)) strip.push(w); });
    if(category) strip.push(category);
    ['今天','昨天','花了','付了','支出','消费','记','一笔'].forEach(w => { if(note.includes(w)) strip.push(w); });
    strip.sort((a,b)=> b.length - a.length);
    strip.forEach(w => { note = note.split(w).join(''); });
    note = note.replace(/[\s,，。、!！?？:：;；"'“”‘’()（）[\]【】]+/g, ' ').trim();

    return { type, amount, category, wallet, from: fromWallet, to: toWallet, note };
  }

  window.submitQuick = function(){
    const txt = document.getElementById('quickInput').value;
    const p = parseNL(txt);
    if(!p){ alert('没看懂～试试：「午餐 35 微信」或「发工资 11000 工资卡」'); return; }
    editingId = null;
    currentType = p.type;
    currentCat = p.category;
    currentWallet = p.wallet || (wallets[0] ? wallets[0].id : null);
    currentFromWallet = p.from || (wallets[0] ? wallets[0].id : null);
    currentToWallet = p.to || (wallets[1] ? wallets[1].id : (wallets[0] ? wallets[0].id : null));
    document.getElementById('amtInput').value = p.amount;
    document.getElementById('noteInput').value = p.note || '';
    document.getElementById('dateInput').value = todayStr();
    document.getElementById('btnDelete').style.display = 'none';
    updateTypeUI();
    renderCatGrid();
    renderWalletChips();
    renderTransferChips();
    showSheet('sheetTxn');
    document.getElementById('quickInput').value = '';
  };

  // ===== 分类管理 =====
  function renderCatManager(){
    document.getElementById('expCatList').innerHTML = expenseCats.map(c => '<span class="cm-chip" data-type="expense" data-name="'+escapeHtml(c[0])+'">'+c[1]+' '+escapeHtml(c[0])+' <span class="del">✕</span></span>').join('');
    document.getElementById('incCatList').innerHTML = incomeCats.map(c => '<span class="cm-chip" data-type="income" data-name="'+escapeHtml(c[0])+'">'+c[1]+' '+escapeHtml(c[0])+' <span class="del">✕</span></span>').join('');
    document.querySelectorAll('.cm-chip').forEach(chip => chip.addEventListener('click', function(e){
      if(e.target.classList.contains('del')){ deleteCategory(this.dataset.type, this.dataset.name); }
    }));
    const eb = document.getElementById('catEmojiPick');
    eb.innerHTML = CAT_EMOJIS.map(e => '<div class="eopt'+(pickedCatEmoji===e?' on':'')+'" data-e="'+e+'">'+e+'</div>').join('');
    eb.querySelectorAll('.eopt').forEach(el => el.addEventListener('click', () => {
      pickedCatEmoji = el.dataset.e;
      eb.querySelectorAll('.eopt').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
    }));
  }

  window.addCategory = function(){
    const name = document.getElementById('newCatName').value.trim();
    if(!name){ alert('请输入分类名称'); return; }
    const list = newCatType === 'income' ? incomeCats : expenseCats;
    if(list.some(c => c[0] === name)){ alert('这个分类已存在'); return; }
    list.push([name, pickedCatEmoji]);
    saveCats();
    document.getElementById('newCatName').value = '';
    renderCatManager();
  };

  function deleteCategory(type, name){
    const used = txns.filter(t => t.type === type && t.category === name).length;
    if(!confirm('删除分类「'+name+'」？' + (used ? ('\n有 '+used+' 笔记录用到它，删除后这些记录的图标会失效（数据保留）。') : ''))) return;
    if(type === 'income') incomeCats = incomeCats.filter(c => c[0] !== name);
    else expenseCats = expenseCats.filter(c => c[0] !== name);
    saveCats();
    renderCatManager();
    if(currentTab === 'list') renderList(monthTxns(currentMonth));
  };

  // ===== 分类统计 =====
  function periodTxns(period){
    if(period === 'all') return txns;
    const months = period === '3m' ? 3 : (period === '12m' ? 12 : 1);
    const now = new Date();
    const cutoff = monthKey(new Date(now.getFullYear(), now.getMonth() - (months - 1), 1));
    return txns.filter(t => t.date.slice(0,7) >= cutoff);
  }

  function renderCatStats(){
    const list = periodTxns(catStatPeriod).filter(t => t.type === catStatType);
    const byCat = {};
    list.forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
    const total = Object.values(byCat).reduce((a,b)=>a+b,0);
    const arr = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    drawDonut(arr, total);
    renderCatList(arr, total);
  }

  function drawDonut(arr, total){
    const canvas = document.getElementById('catDonut');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const size = 172;
    canvas.style.width = size+'px';
    canvas.style.height = size+'px';
    canvas.width = Math.round(size*dpr);
    canvas.height = Math.round(size*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const cx = size/2, cy = size/2, r = size/2 - 14, inner = r*0.58;
    ctx.clearRect(0,0,size,size);
    if(total <= 0 || arr.length === 0){
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.strokeStyle='#eceef1'; ctx.lineWidth=20; ctx.stroke();
      ctx.fillStyle='#8a8f98'; ctx.font='13px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('暂无数据', cx, cy);
      return;
    }
    let start = -Math.PI/2;
    const gap = 0.02;
    arr.forEach(([,v], i) => {
      const angle = (v/total) * Math.PI*2;
      const color = DONUT_PALETTE[i % DONUT_PALETTE.length];
      ctx.beginPath();
      ctx.arc(cx, cy, r, start + gap, start + angle - gap);
      ctx.arc(cx, cy, inner, start + angle - gap, start + gap, true);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      start += angle;
    });
    ctx.fillStyle='#1a1d21'; ctx.font='bold 17px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(fmtCompact(total), cx, cy - 8);
    ctx.fillStyle='#8a8f98'; ctx.font='11px -apple-system, sans-serif';
    ctx.fillText(catStatType === 'expense' ? '总支出' : '总收入', cx, cy + 12);
  }

  function renderCatList(arr, total){
    const el = document.getElementById('catStatList');
    if(arr.length === 0){
      el.innerHTML = '<div class="breakdown-empty">该时间段暂无数据</div>';
      return;
    }
    let html = '';
    arr.forEach(([cat, v], i) => {
      const [name, emoji] = catOf(catStatType, cat);
      const pct = total>0 ? (v/total*100) : 0;
      const color = DONUT_PALETTE[i % DONUT_PALETTE.length];
      html += '<div class="cat-rank-item">'
        + '<div class="cat-rank-top"><span class="cname"><i class="cdot" style="background:'+color+'"></i>'+emoji+' '+escapeHtml(name)+'</span><span class="cval">'+fmtPlain(v)+' · '+pct.toFixed(1)+'%</span></div>'
        + '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(pct,1.5)+'%;background:'+color+'"></div></div>'
        + '</div>';
    });
    el.innerHTML = html;
  }

  // 初始化
  load();
  currentMonth = nowMonth();
  render();
  document.getElementById('searchInput').addEventListener('input', function(){
    searchQuery = this.value.trim();
    document.getElementById('searchClear').style.display = searchQuery ? 'inline-block' : 'none';
    render();
  });
  document.getElementById('quickInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') submitQuick();
  });
  document.querySelectorAll('.cm-tb').forEach(b => b.addEventListener('click', () => {
    newCatType = b.dataset.t;
    document.querySelectorAll('.cm-tb').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  }));
  document.querySelectorAll('.catstat-type .cst').forEach(b => b.addEventListener('click', () => {
    catStatType = b.dataset.t;
    document.querySelectorAll('.catstat-type .cst').forEach(x => x.classList.toggle('on', x === b));
    renderCatStats();
  }));
  document.querySelectorAll('.catstat-period .csp').forEach(b => b.addEventListener('click', () => {
    catStatPeriod = b.dataset.p;
    document.querySelectorAll('.catstat-period .csp').forEach(x => x.classList.toggle('on', x === b));
    renderCatStats();
  }));

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
